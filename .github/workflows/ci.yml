name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          # Nur das für Lint + Tests Nötige (CPU-Torch, kein Emulator/OpenCV).
          # Fallback auf PyPI: der PyTorch-Index fiel schon per SSL-Fehler aus
          # (download-r2.pytorch.org, 06.07.2026) - PyPI-Wheel ist größer, geht aber.
          pip install torch --index-url https://download.pytorch.org/whl/cpu \
            || pip install torch
          pip install numpy matplotlib
          pip install -r requirements-dev.txt
          # Paket editierbar installieren: die Tests importieren mario.*
          pip install -e .

      - name: Linting (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q
