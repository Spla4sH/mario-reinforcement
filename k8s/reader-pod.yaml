# Kleiner Hilfs-Pod, um nach dem Sweep die Ergebnisse von der PVC zu holen:
#
#   kubectl apply -f k8s/reader-pod.yaml
#   kubectl wait --for=condition=Ready pod/mario-sweep-reader
#   kubectl cp mario-sweep-reader:/data/logs ./sweep_results
#   kubectl delete -f k8s/reader-pod.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: mario-sweep-reader
spec:
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: mario-sweep-data}
