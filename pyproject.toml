[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# F = pyflakes (echte Bugs: ungenutzte Importe/Variablen, undefinierte Namen)
# E = pycodestyle-Fehler; E501 (Zeilenlänge) bewusst gelockert
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
